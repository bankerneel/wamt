function alerts(L) {
  const w = plateOf(L);
  const pct = w && w.active && w.cap && w.pct != null ? w.pct : null;
  const waiting = L.threads.filter((t) => t.waiting || (t.run && t.run.status === "waiting"));
  const eating = L.threads.filter((t) => t.run && t.run.status !== "waiting").length;
  // Title: the most urgent part first, since tabs cut titles short.
  const parts = [];
  if (waiting.length) parts.push(`${waiting.length} needs you`);
  if (pct != null) parts.push(`${Math.round(pct * 100)}%`);
  if (eating) parts.push(`${eating} eating`);
  document.title = parts.length ? parts.join(" · ") + " · Who Ate My Tokens" : "Who Ate My Tokens";
  // Favicon: a ring that fills with the plate, a red dot when a thread waits.
  const key = `${pct == null ? "-" : Math.round(pct * 50)}|${waiting.length > 0}`;
  if (A.icon && key !== A.key) {
    A.key = key;
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d");
    g.drawImage(A.icon, 8, 8, 48, 48);
    if (pct != null) {
      g.lineWidth = 6; g.lineCap = "round";
      g.strokeStyle = "rgba(58,47,61,.18)"; g.beginPath(); g.arc(32, 32, 28, 0, 2 * Math.PI); g.stroke();
      g.strokeStyle = pct >= 0.8 ? "#d4645a" : pct >= 0.5 ? "#c49012" : "#5f8f55";
      g.beginPath(); g.arc(32, 32, 28, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * Math.min(pct, 1)); g.stroke();
    }
    if (waiting.length) { g.fillStyle = "#e0412f"; g.strokeStyle = "#fff"; g.lineWidth = 4; g.beginPath(); g.arc(50, 14, 12, 0, 2 * Math.PI); g.fill(); g.stroke(); }
    document.querySelector('link[rel="icon"]').href = c.toDataURL("image/png");
  }
  // Notifications: once per event; whatever is already true on load is not news.
  const events = [];
  for (const t of waiting) {
    const since = (t.waiting && t.waiting.since) || (t.run && t.run.step && t.run.step.since) || "";
    events.push([`wait:${t.id}:${since}`, "A thread needs you", t.title || "A T3 thread is waiting on you"]);
  }
  if (pct != null && pct >= 0.8) events.push([`p80:${w.start_ms}`, `The plate is ${Math.round(pct * 100)}% eaten`, `Resets at ${hhmm(w.end_ms)}. Estimated from this Mac's usage.`]);
  const wk = weekState();
  if (wk && wk.cal && wk.cap > 0 && wk.pct >= 0.8) events.push([`w80:${wk.start}`, `The weekly meter is ${Math.round(wk.pct * 100)}% used`, `Resets ${weekWdTime(wk.reset)}. Estimated from this Mac's usage.`]);
  if (w && w.active && w.cap) for (const t of L.threads) {
    const share = (t.eat30 || 0) / w.cap.used;
    if (share >= 0.25) events.push([`binge:${t.id}:${w.start_ms}`, `${t.title || "A thread"} is binging`, `It ate ${Math.round(share * 100)}% of the 5-hour plate in the last 30 minutes. Check it is not stuck in a loop.`]);
  }
  for (const t of L.threads) {
    if (!t.ctx || !(t.ctx.max > 0)) continue;
    const p = t.ctx.used / t.ctx.max, k = `ctx85:${t.id}`;
    if (p >= 0.85) events.push([k, `Context ${Math.round(p * 100)}% full`, `${t.title || "A thread"} is near its context limit; compaction or a fresh thread is close, and every request now resends a lot.`]);
    else if (p < 0.7) A.seen.delete(k); // after a compaction it can warn again
  }
  for (const t of waiting) {
    const exp = t.ctx && t.ctx.cache_exp;
    if (exp && exp > now() && exp - now() <= 5 * 60e3) events.push([`cold:${t.id}:${exp}`, "Cache going cold", `${t.title || "A thread"} waits on you; its prompt cache expires at ${hhmm(exp)}. Answer before then to avoid paying to rebuild it.`]);
  }
  if (pct != null && pct < 1 && w.eta_ms != null) events.push([`eta:${w.start_ms}`, `At this pace, empty by ${hhmm(w.eta_ms)}`, `That is before the reset at ${hhmm(w.end_ms)}. Estimate.`]);
  for (const [k, title, body] of events) {
    if (A.seen.has(k)) continue;
    A.seen.add(k);
    if (A.primed && A.on) { try { new Notification(title, { body, tag: k, icon: "/assets/favicon.png" }); } catch (_) {} }
  }
  if (A.seen.size > 500) A.seen = new Set(events.map((e) => e[0]));
  if (A.primed) endOfDay();
  A.primed = true;
}

// ------------------------------------------------------------------ drill-down
// One thread's day: runs, tool counts, subagents and a 10-minute token
// timeline, fetched on demand from /api/thread (counts and names only).
const D = { id: null, day: null, opener: null, timer: 0, seq: 0 };
const drillEl = $("drill"), drillBody = $("drillBody");

function openDrill(id, opener, day) {
  if (!id) return;
  day = day || null;
  const again = D.id === id && D.day === day && !drillEl.hidden;
  D.id = id; D.day = day; D.opener = opener || null;
  drillEl.hidden = false;
  document.body.style.overflow = "hidden";
  if (!again) drillBody.innerHTML = '<span class="ticket t-sky">Thread</span><p class="none">Loading the day for this thread.</p>';
  loadDrill(id, !again, day);
  clearInterval(D.timer);
  D.timer = setInterval(() => loadDrill(id, false, day), 20000);
  if (!again) $("drillClose").focus();
}
function closeDrill() {
  if (drillEl.hidden) return;
  drillEl.hidden = true; D.id = null; D.day = null; D.seq++;
  clearInterval(D.timer);
  document.body.style.overflow = "";
  const o = D.opener; D.opener = null;
  if (o && o.isConnected) o.focus();
}
function loadDrill(id, first, day) {
  const seq = ++D.seq;
  const url = "/api/thread?id=" + encodeURIComponent(id) + (day ? "&day=" + encodeURIComponent(day) : "");
  fetch(url).then((r) => {
    if (r.status === 404) throw new Error("T3 no longer lists this thread.");
    if (!r.ok) throw new Error("The thread details could not be read (" + r.status + ").");
    return r.json();
  }).then((d) => { if (seq === D.seq && D.id === id) drillBody.innerHTML = drillHtml(d); })
    .catch((e) => { if (seq === D.seq && (first || !drillBody.querySelector("#drillTitle"))) drillBody.innerHTML = `<span class="ticket t-sky">Thread</span><p class="none">${esc(e.message)}</p>`; });
}

function drillTimeline(d) {
  const tl = d.timeline, B = tl.bucket_ms, bs = tl.buckets;
  if (!bs.length) return '<p class="none">No token usage recorded for this thread today.</p>';
  const first = Math.floor((bs[0].t - d.day_start) / B), nowSlot = Math.floor((d.now - d.day_start) / B);
  const last = Math.max(nowSlot, Math.floor((bs[bs.length - 1].t - d.day_start) / B));
  const from = Math.max(0, Math.min(first, last - 5)), n = last - from + 1;
  const byT = new Map(bs.map((b) => [b.t, b]));
  const sum = (b) => b.w[0] + b.w[1] + b.w[2] + b.w[3];
  const max = Math.max(...bs.map(sum)) || 1, all = bs.reduce((a, b) => a + sum(b), 0) || 1;
  const W = 560, H = 120, padL = 4, padB = 18, plotH = H - padB, colW = (W - padL) / n, gap = Math.min(2, colW / 4);
  let svg = `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Token usage for this thread today, per 10 minutes">`;
  const used = [false, false, false, false];
  for (let i = 0; i < n; i++) {
    const t = d.day_start + (from + i) * B, b = byT.get(t), x = padL + i * colW;
    const tip = b
      ? `<b>${hhmm(t)} to ${hhmm(t + B)}</b><br>${((sum(b) / all) * 100).toFixed(1)}% of this thread today<br>${full(b.out)} output tokens<br>` + b.w.map((v, k) => (v > 0 ? `${FAM[k]}: ${((v / sum(b)) * 100).toFixed(0)}%` : "")).filter(Boolean).join(", ")
      : `<b>${hhmm(t)} to ${hhmm(t + B)}</b><br>no usage`;
    if (b) {
      let y = plotH;
      for (let k = 0; k < 4; k++) {
        if (b.w[k] <= 0) continue;
        const h = Math.max(1, (b.w[k] / max) * (plotH - 4));
        y -= h; used[k] = true;
        svg += `<rect class="m${k}" x="${(x + gap / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, colW - gap).toFixed(1)}" height="${h.toFixed(1)}"/>`;
      }
    }
    svg += `<rect class="hit" x="${x.toFixed(1)}" y="0" width="${colW.toFixed(1)}" height="${plotH}" data-tip="${esc(tip)}"/>`;
  }
  svg += `<line class="axis" x1="0" x2="${W}" y1="${plotH}" y2="${plotH}"/>`;
  const ticks = n <= 6 ? [0, n - 1] : [0, Math.floor((n - 1) / 2), n - 1];
  ticks.forEach((i, j) => { svg += `<text x="${(padL + i * colW + (j === ticks.length - 1 && ticks.length > 1 ? colW : 0)).toFixed(1)}" y="${H - 4}" text-anchor="${j === 0 ? "start" : j === ticks.length - 1 ? "end" : "middle"}">${hhmm(d.day_start + (from + i) * B)}</text>`; });
  svg += "</svg>";
  const legend = '<div class="legend">' + used.map((u, k) => (u ? `<span>${sw(k)}${FAM[k]}</span>` : "")).join("") + `<span class="muted">bar height is weighted usage, ${tl.sessions} session${tl.sessions === 1 ? "" : "s"}</span></div>`;
  return svg + legend;
}

function drillHtml(d) {
  const fam = family(d.model);
  const when = d.is_today ? "today" : "on " + esc(d.day);
  let h = `<span class="ticket t-sky">Thread</span><div class="dtitle" id="drillTitle">${esc(d.title)}</div>
    <div class="dmeta">${d.model ? chip(d.model) : ""}${d.project ? `<span>${esc(d.project)}</span>` : ""}<span class="muted">${d.is_today ? "today, until " + hhmm(d.now) : esc(d.day)}</span></div>
    <span class="hand aside">what it ate ${when}</span>`;
  // Buckets are kept for the current day only; other days get one quiet line.
  h += `<h4>Token timeline <span class="sub2">per 10 minutes</span></h4>` +
    (d.is_today ? drillTimeline(d) : '<p class="none">The 10-minute token timeline is available for today only.</p>');

  h += `<h4>Runs ${when} <span class="sub2">${d.runs.length}</span></h4>`;
  if (!d.runs.length) h += `<p class="none">No runs ${when}.</p>`;
  else {
    const shown = d.runs.slice(-30);
    h += `<div class="tablewrap"><table><thead><tr><th class="l">Run</th><th class="l">Started</th><th>Length</th><th class="l">Status</th><th class="l">Model</th></tr></thead><tbody>` +
      shown.map((r) => `<tr><td class="l num">${r.n}${r.delegated ? ' <span class="muted">delegated</span>' : ""}</td><td class="l num">${hhmm(r.at)}</td><td class="num">${r.ms != null ? dur(r.ms) : "-"}</td><td class="l"><span class="st ${esc(r.status)}">${esc(r.status)}</span></td><td class="l">${r.model ? chip(r.model) : ""}</td></tr>`).join("") +
      "</tbody></table></div>" + (d.runs.length > shown.length ? `<p class="fine">and ${d.runs.length - shown.length} earlier runs</p>` : "");
  }

  h += `<h4>Tool calls ${when} <span class="sub2">${full(d.tools.reduce((a, t) => a + t.n, 0))}</span></h4>`;
  if (!d.tools.length) h += `<p class="none">No tool calls ${when}.</p>`;
  else {
    const mx = d.tools[0].n || 1;
    h += '<ul class="bars">' + d.tools.slice(0, 12).map((t) => `<li><div><div class="nm" title="${esc(t.name)}">${esc(t.name)}</div><div class="bar"><i style="width:${((t.n / mx) * 100).toFixed(1)}%"></i></div></div><div class="v num">${full(t.n)}</div></li>`).join("") + "</ul>" +
      (d.tools.length > 12 ? `<p class="fine">and ${d.tools.length - 12} more tools</p>` : "");
  }

  h += `<h4>Turn items ${when}</h4>`;
  h += d.items.length ? '<div class="types">' + d.items.map((i) => `<span>${esc(i.type.replace(/_/g, " "))}<b class="num">${full(i.n)}</b></span>`).join("") + "</div>" : `<p class="none">None ${when}.</p>`;

  h += `<h4>Subagents ${when} <span class="sub2">${d.subagents.length}</span></h4>`;
  if (!d.subagents.length) h += `<p class="none">No subagents ${when}.</p>`;
  else h += `<div class="tablewrap"><table><thead><tr><th class="l">Subagent</th><th class="l">Model</th><th>Started</th><th>Length</th><th class="l">Status</th></tr></thead><tbody>` +
    d.subagents.slice(0, 30).map((s) => `<tr><td class="l" title="${esc(s.title || "")}">${esc(s.title || (s.origin === "provider_native" ? "built-in subagent" : "subagent"))}</td><td class="l">${s.model ? chip(s.model) : ""}</td><td class="num">${hhmm(s.at)}</td><td class="num">${s.ms != null ? dur(s.ms) : "-"}</td><td class="l"><span class="st ${esc(s.status)}">${esc(s.status)}</span></td></tr>`).join("") + "</tbody></table></div>" +
    (d.subagents.length > 30 ? `<p class="fine">and ${d.subagents.length - 30} more</p>` : "");
  return h;
}

document.addEventListener("click", (e) => {
  if (e.target === drillEl) { closeDrill(); return; }
  const el = e.target.closest && e.target.closest("[data-thread]");
  if (el && !drillEl.contains(el)) {
    // Selecting text in a row is not a click on it.
    const sel = window.getSelection && String(window.getSelection());
    if (sel) return;
    openDrill(el.dataset.thread, el, el.dataset.day);
  }
});
$("drillClose").addEventListener("click", closeDrill);
document.addEventListener("keydown", (e) => {
  if (drillEl.hidden) {
    const el = e.target.closest && e.target.closest("[data-thread]");
    if (el && e.target === el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDrill(el.dataset.thread, el, el.dataset.day); }
    return;
  }
  if (e.key === "Escape") { e.preventDefault(); closeDrill(); return; }
  if (e.key === "Tab") {
    // Keep focus inside the sheet while it is open.
    const f = [...drillEl.querySelectorAll("button, [href], [tabindex]:not([tabindex='-1'])")].filter((x) => !x.disabled);
    if (!f.length) return;
    const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === a || document.activeElement === drillEl.firstElementChild)) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});

// ------------------------------------------------------------------ stream
// While the tab is hidden, keep the data and the alerts (title, favicon,
// notifications) current but skip drawing; draw once when it is shown again.
function drawAll() {
  if (S.live) { renderHeader(); renderReadout(); renderBoard(); renderWindow(); renderSpark(); renderFoot(); tick(); }
  if (S.days) renderDays(false);
  renderFeed();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.behind) { S.behind = false; drawAll(); } });
function onLive(L) {
  S.live = L; S.skew = L.now - Date.now(); S.lastMsg = Date.now();
  if (document.hidden) S.behind = true;
  else { renderHeader(); renderReadout(); renderBoard(); renderWindow(); renderSpark(); renderFoot(); tick(); }
  alerts(L);
}
function onDays(raw) { S.rawDays = raw; S.days = JSON.parse(raw); if (document.hidden) S.behind = true; else renderDays(false); }
function onFeed(items, fresh) {
  for (const f of items) { if (fresh && !S.feed.has(f.id)) S.fresh.add(f.id); S.feed.set(f.id, f); }
  if (S.feed.size > 600) { const sorted = [...S.feed.values()].sort((a, b) => a.ts - b.ts); for (const f of sorted.slice(0, S.feed.size - 600)) S.feed.delete(f.id); }
  if (document.hidden) S.behind = true; else renderFeed();
}
function connect() {
  const params = new URLSearchParams(location.search);
  if (params.has("snapshot")) {
    fetch("/api/state").then((r) => r.json()).then((s) => { S.connected = true; onLive(s.live); onDays(JSON.stringify(s.days)); onFeed(s.feed, false); if (params.get("thread")) openDrill(params.get("thread"), null, params.get("day")); });
    return;
  }
  const es = new EventSource("/events");
  es.addEventListener("hello", (e) => {
    S.connected = true;
    const s = JSON.parse(e.data);
    S.feed.clear(); $("feed").innerHTML = ""; S.feedReady = false;
    // Live first: it carries the time zone every other panel formats with.
    onLive(s.live); onDays(JSON.stringify(s.days)); onFeed(s.feed, false);
  });
  es.addEventListener("live", (e) => { S.connected = true; onLive(JSON.parse(e.data)); });
  es.addEventListener("days", (e) => onDays(e.data));
  es.addEventListener("feed", (e) => onFeed(JSON.parse(e.data), true));
  es.onopen = () => { S.connected = true; S.retry = 1000; };
  es.onerror = () => {
    S.connected = false; renderStatus(); $("hdrLamp").className = "lamp";
    // The browser retries dropped streams itself, but gives up for good
    // after an HTTP error (a restart mid-request, the connection cap).
    // Then reconnect here, backing off up to 30 s.
    if (es.readyState === EventSource.CLOSED) {
      S.retry = Math.min(30000, (S.retry || 1000) * 2);
      setTimeout(connect, S.retry);
    }
  };
}
connect();
</script>
</body>
</html>
