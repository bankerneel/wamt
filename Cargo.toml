[package]
name = "wamt"
version = "0.1.0"
edition = "2021"
description = "Who Ate My Tokens: a local live dashboard of T3 Code threads and Claude Code usage"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
memchr = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
