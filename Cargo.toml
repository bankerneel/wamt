[package]
name = "wamt"
version = "0.1.0"
edition = "2021"
description = "Who Ate My Tokens: a local, read-only token observation layer for T3 Code, Claude Code and Codex"
license = "MIT"
repository = "https://github.com/bankerneel/wamt"
homepage = "https://github.com/bankerneel/wamt#readme"
readme = "README.md"
keywords = ["claude-code", "t3-code", "token-usage", "dashboard", "llm"]
categories = ["development-tools", "command-line-utilities", "visualization"]
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
memchr = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
